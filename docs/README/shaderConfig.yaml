shaders_root_directory:
  # ABSOLUTE PATH to the shader root directory
  D:\Documents\Coding\C#\shader-md\docs\README\shaders

# EVERY SHADER AS RELATIVE PATH FROM shader_root_directory
document_shaders:
  # Document-wide background
  background:
    shader_path:
      prismaticMixture.frag
    shader_parameters:
      timescale: 0.25
      effectAlpha: 0.075
      lacunarity: 2.5
  # Applied to the whole shaderized document, as a final shader
  finalize:
    shader_path:   
    shader_parameters:

